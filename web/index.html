<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="FestiveKart - Premium crackers, gifts and decorations for all your celebrations.">
  <meta name="google-site-verification" content="wu2_J_Fv5tDLG00HwUCIdbjFYORTsd2l1jkK1rI651E" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FestiveKart">
  <link rel="apple-touch-icon" href="icons/Icon-192.PNG">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FestiveKart</title>
  <link rel="manifest" href="manifest.json">
  <!-- Google Sign-In & Identity Services for Web -->
  <meta name="google-signin-client_id" content="734262498360-kaa955ci39o54d2nopts87m4m1i2d3ok.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Firebase JS SDK (Compat version matching Flutter plugin fallbacks, deferred to prevent render-blocking) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-remote-config-compat.js" defer></script>
</head>
<body>

  <div id="loading-splash" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #02091D; z-index: 99999; margin: 0; overflow: hidden;">
  </div>

  <script>
    const observer = new MutationObserver((mutations) => {
      // Hide Dart SDK development warnings if they are injected
      const divs = document.querySelectorAll('div');
      for (const div of divs) {
        if (div.textContent && (div.textContent.includes('compiled using a development version') || div.textContent.includes('compiled with a development version'))) {
          div.style.display = 'none';
        }
      }

      for (const mutation of mutations) {
        for (const node of mutation.addedNodes) {
          if (node.tagName && node.tagName.toLowerCase() === 'flutter-view') {
            const splash = document.getElementById('loading-splash');
            if (splash) {
              splash.style.transition = 'opacity 0.6s ease-out';
              splash.style.opacity = '0';
              splash.style.pointerEvents = 'none';
              setTimeout(() => splash.remove(), 600);
            }
            break;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
