name: festivekart
description: "FestiveKart a complete festival needs"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.0.10+1
  image_picker: ^1.0.7
  image_picker_for_web: ^3.0.2
  firebase_core: ^2.27.0
  firebase_remote_config: ^4.3.8
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.0
  dio: ^5.4.0
  package_info_plus: ^5.0.1
  open_file: ^3.3.2
  permission_handler: ^11.3.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true
  assets:
    - assets/images/